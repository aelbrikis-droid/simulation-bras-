  <text x="460" y="34" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="bold" fill="#0f172a">Schéma cinématique — Bras manipulateur à parallélogramme (OABC)</text>
  <text x="460" y="56" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#475569">Plan vertical (O₀, u_r, z₀) — M1 entraîne Bras 1 (θ₁), M2 entraîne Manivelle (OC) → Bielle (CB) → Bras 2 (θ₂)</text>
