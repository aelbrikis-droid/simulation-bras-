  <path d="M 431.6 128.2 A 72.0 72.0 0 0 1 428.1 150.4" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <text x="439.6" y="150.2" font-family="Segoe UI, Arial" font-size="16" font-weight="bold" fill="#059669">θ₂</text>
  <circle cx="270.0" cy="520.0" r="6.5" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="280.0" y="542.0" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="#334155">O₀ (base)</text>
  <circle cx="270.0" cy="404.0" r="6.5" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="165.0" y="426.0" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="#0f172a">O (M1, M2)</text>
  <circle cx="359.6" cy="128.2" r="6.5" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="349.6" y="110.2" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="#0f172a">A (coude)</text>
  <circle cx="276.9" cy="101.3" r="6.5" fill="#ffffff" stroke="#059669" stroke-width="3"/>
  <text x="198.9" y="91.3" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="#059669">B (talon)</text>
  <circle cx="187.3" cy="377.1" r="6.5" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <text x="72.3" y="382.1" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="#7c3aed">C (manivelle)</text>
  <circle cx="635.4" cy="217.8" r="6.5" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
  <text x="647.4" y="223.8" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="#dc2626">E (effecteur)</text>
  <text x="330.8" y="272.1" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="#1d4ed8">Bras 1 (L₁)</text>
  <text x="156.1" y="239.2" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="#d97706">Bielle (b=L₁)</text>
  <text x="501.5" y="159.0" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="#047857">Bras 2 (L₂)</text>
  <text x="212.6" y="414.6" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="#6d28d9">a</text>
  <text x="308.2" y="96.8" font-family="Segoe UI, Arial" font-size="13" font-weight="bold" fill="#047857">a</text>
  <rect x="615" y="88" width="280" height="175" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="8"/>
  <text x="630" y="114" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="#0f172a">Fermeture parallélogramme :</text>
  <text x="630" y="136" font-family="Consolas, monospace" font-size="12.5" fill="#334155">OA = CB = L₁  et  OC = AB = a</text>
  <text x="630" y="156" font-family="Consolas, monospace" font-size="12.5" fill="#334155">⇒ AB = OC  ⇒  orientation(AE) = θ₂</text>
  <text x="630" y="186" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" fill="#0f172a">Modèle Géométrique Direct :</text>
  <text x="630" y="208" font-family="Consolas, monospace" font-size="12.5" fill="#1e293b">r_E = L₁·cos(θ₁) + L₂·cos(θ₂)</text>
  <text x="630" y="228" font-family="Consolas, monospace" font-size="12.5" fill="#1e293b">z_E = h₀ + L₁·sin(θ₁) + L₂·sin(θ₂)</text>
  <text x="630" y="248" font-family="Consolas, monospace" font-size="12" fill="#475569">x_E = r_E·cos(θ₀), y_E = r_E·sin(θ₀)</text>
</svg>